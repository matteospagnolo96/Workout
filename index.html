<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OlympusPro - Workout Tracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen pb-32">

    <header class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-xl border-b border-white/5 p-6 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black tracking-tighter text-white">OLYMPUS<span class="text-emerald-500">PRO</span></h1>
            <p class="text-[9px] font-bold text-slate-500 uppercase tracking-[0.3em]">Training System</p>
        </div>
        <button id="header-back-btn" onclick="backToHome()" class="hidden p-3 bg-slate-900 rounded-2xl text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
    </header>

    <main class="max-w-md mx-auto p-4">
        
        <section id="auth-screen" class="min-h-[70vh] flex flex-col justify-center items-center space-y-8 animate-fadeIn">
            <div class="text-center">
                <h2 class="text-white font-black text-xl uppercase tracking-widest">Benvenuto Atleta</h2>
                <p class="text-slate-500 text-[10px] font-bold uppercase mt-2">Accedi per salvare i tuoi progressi</p>
            </div>
            <div class="w-full space-y-4 bg-slate-900/50 p-6 rounded-[32px] border border-white/5">
                <input type="email" id="auth-email" placeholder="Email" class="w-full bg-slate-800 p-5 rounded-2xl text-white outline-none border border-white/5 focus:border-emerald-500/50">
                <input type="password" id="auth-password" placeholder="Password" class="w-full bg-slate-800 p-5 rounded-2xl text-white outline-none border border-white/5 focus:border-emerald-500/50">
                <div class="grid grid-cols-2 gap-4 pt-2">
                    <button onclick="handleAuth('login')" class="py-4 rounded-2xl bg-slate-800 text-white font-black uppercase text-[10px] tracking-widest">Accedi</button>
                    <button onclick="handleAuth('signup')" class="py-4 rounded-2xl bg-emerald-500 text-slate-950 font-black uppercase text-[10px] tracking-widest">Registrati</button>
                </div>
            </div>
        </section>

        <div id="app-content" class="hidden">
            <section id="home" class="tab-content active space-y-10">
                <div id="home-main-view">
                    <div class="space-y-4">
                        <h2 class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] ml-2">Programmi Attivi</h2>
                        <div id="plan-list" class="space-y-4"></div>
                    </div>
                    <div class="space-y-4 mt-10">
                        <h2 class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] ml-2">I Tuoi Test / PR</h2>
                        <div id="test-list" class="space-y-4"></div>
                    </div>
                    <div id="archive-section" class="hidden mt-10 opacity-50">
                        <h2 class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] ml-2">Archivio</h2>
                        <div id="archive-list" class="space-y-4 mt-4"></div>
                    </div>
                </div>

                <div id="active-session-container" class="hidden space-y-8 animate-fadeIn">
                    <div id="session-header"></div>
                    <div id="session-exercises" class="space-y-6"></div>
                    <div class="bg-slate-800 p-6 rounded-[32px] border border-white/5">
                        <textarea id="session-final-note" placeholder="Note finali sulla sessione..." class="w-full bg-slate-900 rounded-2xl p-4 text-sm text-white outline-none"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="skipSession()" class="py-5 rounded-[28px] bg-slate-900 text-slate-500 font-black uppercase text-[10px] tracking-widest">Salta</button>
                        <button onclick="finishSession()" class="py-5 rounded-[28px] bg-emerald-500 text-slate-950 font-black uppercase text-[10px] tracking-widest shadow-lg shadow-emerald-500/20">Concludi</button>
                    </div>
                </div>
            </section>

            <section id="create" class="tab-content hidden space-y-8 animate-fadeIn">
                <input type="hidden" id="edit-id">
                <div class="flex gap-2 p-1 bg-slate-900 rounded-[22px] border border-white/5">
                    <button id="btn-mode-plan" onclick="setCreateMode('plan')" class="flex-1 py-3 rounded-[18px] text-[10px] font-black bg-emerald-500 text-slate-900 uppercase">Programma</button>
                    <button id="btn-mode-test" onclick="setCreateMode('test')" class="flex-1 py-3 rounded-[18px] text-[10px] font-black text-slate-400 uppercase">Test PR</button>
                </div>
                <div class="space-y-4">
                    <label class="text-[9px] font-black text-slate-500 uppercase tracking-widest ml-2 block">Dettagli Programma</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-emerald-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                        </div>
                        <input type="text" id="create-name" placeholder="Nome Programma" class="w-full bg-slate-800/80 p-5 pl-14 rounded-[24px] border border-white/5 text-white font-bold outline-none focus:border-emerald-500/40 focus:bg-slate-800 transition-all placeholder:text-slate-500">
                    </div>
                    <div id="weeks-input-container" class="relative">
                        <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-emerald-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                        </div>
                        <input type="number" id="create-weeks" placeholder="Durata (Settimane)" class="w-full bg-slate-800/80 p-5 pl-14 rounded-[24px] border border-white/5 text-white font-bold outline-none focus:border-emerald-500/40 focus:bg-slate-800 transition-all placeholder:text-slate-500">
                    </div>
                </div>
                <div id="create-days-container" class="space-y-10"></div>
                <div id="create-actions-container" class="pt-6 space-y-4">
                    <button onclick="addCreateDay()" class="w-full py-5 bg-slate-800 border-2 border-dashed border-white/5 rounded-[24px] text-xs font-black text-slate-400 uppercase tracking-widest hover:border-emerald-500/30 hover:text-emerald-500 transition-all mb-8">+ Aggiungi Giorno</button>

        <div class="flex gap-4">
            <button id="btn-delete-object" onclick="deleteCurrentObject()" class="hidden py-5 px-6 bg-red-500/10 text-red-500 font-extrabold rounded-[24px] uppercase tracking-widest hover:bg-red-500/20 transition-colors border border-red-500/20">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            </button>
            <button onclick="saveCreatedObject()" class="flex-1 w-full py-5 bg-gradient-to-r from-emerald-500 to-emerald-400 text-slate-900 font-extrabold rounded-[24px] uppercase tracking-widest hover:scale-[0.98] transition-transform shadow-xl shadow-emerald-500/20">Salva Scheda</button>
        </div>
                </div>
            </section>

            <section id="history" class="tab-content hidden space-y-6 animate-fadeIn">
                <div class="flex justify-between items-center">
                    <h2 class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] ml-2">Log Allenamenti</h2>
                    <button onclick="supabase.auth.signOut().then(() => location.reload())" class="text-[8px] font-black text-red-500 uppercase tracking-widest mr-2">Logout</button>
                </div>
                <div id="history-container" class="space-y-4"></div>
            </section>
        </div>

    </main>

    <nav id="bottom-nav" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-slate-900/90 backdrop-blur-2xl border border-white/5 p-3 rounded-[35px] flex justify-between items-center shadow-2xl z-50">
        <button onclick="switchTab('home')" id="nav-btn-home" class="nav-button flex-1 flex flex-col items-center py-2 gap-1 transition-colors duration-300 text-emerald-500">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span class="text-[8px] font-black uppercase tracking-tighter">Home</span>
        </button>
        <button onclick="switchTab('create')" id="nav-btn-create" class="nav-button flex-1 flex flex-col items-center py-2 gap-1 transition-colors duration-300 text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            <span class="text-[8px] font-black uppercase tracking-tighter">Crea</span>
        </button>
        <button onclick="switchTab('history')" id="nav-btn-history" class="nav-button flex-1 flex flex-col items-center py-2 gap-1 transition-colors duration-300 text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-6M6 20V10M18 20V4"/></svg>
            <span class="text-[8px] font-black uppercase tracking-tighter">Logs</span>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
